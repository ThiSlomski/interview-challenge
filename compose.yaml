# Synthetic local environment only. Never point these services at a host database.
services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: imobilead
      POSTGRES_USER: compose_admin
      POSTGRES_PASSWORD: compose_only_admin_2026
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command: [postgres, -c, listen_addresses=127.0.0.1, -c, password_encryption=scram-sha-256]
    volumes:
      - postgres-data:/var/lib/postgresql
    # This service owns the shared network namespace, including HTTP publishing.
    # PostgreSQL itself listens only on loopback; 5432 is never published.
    ports:
      - "127.0.0.1:${COMPOSE_HTTP_PORT:-3000}:3443"
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, compose_admin, -d, imobilead]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-init:
    build:
      context: .
      target: db-init
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMIN_DATABASE_URL: postgresql://compose_admin:compose_only_admin_2026@127.0.0.1:5432/imobilead
      MIGRATION_DATABASE_URL: postgresql://imobilead_migrate:compose_only_migrate_2026@127.0.0.1:5432/imobilead
      DATABASE_URL: postgresql://imobilead_app:compose_only_runtime_2026@127.0.0.1:5432/imobilead
      DB_TRUST_REMOVED: "true"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    network_mode: service:db
    depends_on:
      db-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        restart: true
    environment:
      DATABASE_URL: postgresql://imobilead_app:compose_only_runtime_2026@127.0.0.1:5432/imobilead
      HOSTNAME: 127.0.0.1
      DB_TRUST_REMOVED: "true"
      SESSION_TTL_SECONDS: "3600"
      APP_ORIGIN: https://localhost:${COMPOSE_HTTP_PORT:-3000}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      test: [CMD, node, health.mjs]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  gateway:
    build:
      context: .
      target: gateway
    network_mode: service:db
    user: "1000:1000"
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777", "/data:size=16m,uid=1000,gid=1000", "/config:size=16m,uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, https://localhost:3443/]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
